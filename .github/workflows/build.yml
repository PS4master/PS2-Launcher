name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          docker run --rm -v "$PWD:/src" -w /src ps2dev/ps2dev:latest sh -c "apk add --no-cache build-base git zip gawk python3 p7zip bash && git config --global --add safe.directory /src && make"
      - uses: actions/upload-artifact@v4
        with:
          name: PS2L
          path: "*.ELF"
          if-no-files-found: error
